<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincent Lie | Bio & Official Links</title>
    <meta name="description" content="Koleksi tautan resmi, portofolio, produk, dan media sosial Vincent Lie.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%200%20100%20100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-wrapper">
        <div class="profile-card">

            <!-- Tombol menu kanan atas (login / logout / admin) -->
            <button class="menu-btn" id="btn-auth" title="Masuk Admin" aria-label="Menu Admin">
                <i class="fas fa-ellipsis" id="btn-auth-icon"></i>
            </button>

            <!-- Avatar -->
            <div class="avatar-wrapper">
                <img src="" alt="Foto Profil" id="profile-avatar" class="avatar-img">
            </div>

            <!-- Nama & Bio -->
            <h1 class="profile-handle" id="profile-handle">@vincentlie</h1>
            <p class="profile-bio" id="profile-bio">Loading bio...</p>

            <!-- Menu Actions Admin (hanya tampil setelah login) -->
            <div class="admin-bar" id="admin-bar" style="display: none;">
                <button class="admin-chip" id="btn-add-link">
                    <i class="fas fa-plus"></i> Tambah Link
                </button>
                <button class="admin-chip logout" id="btn-logout">
                    <i class="fas fa-right-from-bracket"></i> Keluar
                </button>
            </div>

            <!-- Daftar Link -->
            <nav class="links-list" id="links-container">
                <!-- Link cards di-generate oleh app.js -->
            </nav>

            <!-- Footer kecil -->
            <footer class="page-footer">
                <p>Dibuat dengan <span class="heart">❤</span> · <span id="current-year">2026</span></p>
            </footer>

        </div>
    </main>

    <!-- Modal: Editor Link (Add / Edit) -->
    <div class="modal-backdrop" id="modal-link-editor">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3 id="link-editor-title"><i class="fas fa-plus"></i> Tambah Link</h3>
                <button class="modal-close" data-close="modal-link-editor"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="link-editor-form">
                    <input type="hidden" id="link-id" value="">

                    <div class="form-group">
                        <label for="link-title">Judul Link *</label>
                        <input type="text" id="link-title" placeholder="Misal: Product Recommendations" required>
                    </div>

                    <div class="form-group">
                        <label for="link-url">URL *</label>
                        <input type="url" id="link-url" placeholder="https://contoh.com" required>
                    </div>

                    <div class="form-group">
                        <label for="link-subtitle">Deskripsi Singkat</label>
                        <input type="text" id="link-subtitle" placeholder="Opsional">
                    </div>

                    <label class="checkbox-inline" for="link-highlighted">
                        <input type="checkbox" id="link-highlighted">
                        <span>Tandai sebagai link unggulan</span>
                    </label>

                    <div class="form-actions">
                        <button type="button" class="btn-ghost" id="btn-cancel-link">Batal</button>
                        <button type="submit" class="btn-solid">
                            <i class="fas fa-save"></i> Simpan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
